<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李梅花 | 個人網頁</title>
    <!-- 引入 Google Fonts 與 Font Awesome 圖示 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 亮麗的粉橘漸層背景 */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(253, 160, 133, 0.3);
            animation: popUp 0.6s ease-out;
        }

        @keyframes popUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 個人照片預留區塊 */
        .avatar-box {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            padding: 4px; /* 亮麗外框 */
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.3);
        }

        .avatar-placeholder {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #fff5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ff758c;
            font-size: 13px;
            overflow: hidden;
        }

        /* 若放上照片，圖片會自動填滿圓框 */
        .avatar-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 15px;
            font-weight: 500;
            color: #ff6b81;
            margin-bottom: 16px;
        }

        .bio {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* 興趣與技能標籤 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
        }

        .tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .tag.interest {
            background-color: #fff0f3;
            color: #ff4d6d;
        }

        .tag.skill {
            background-color: #fff8e7;
            color: #f59e0b;
        }

        /* 聯絡方式列表 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: #4a5568;
            background-color: #f8fafc;
            transition: transform 0.2s, background-color 0.2s;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            background-color: #fff0f3;
            color: #ff4d6d;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <main class="card">
        <!-- 個人照片位置 -->
        <div class="avatar-box">
            <div class="avatar-placeholder">
                <!-- 有照片時，把下面這行註解打開，並將 "你的照片.jpg" 換成你的圖片檔名 -->
                <!-- <img src="thip.jpg" alt="李梅花"> -->
                
                <i class="fa-solid fa-camera" style="font-size: 24px; margin-bottom: 4px;"></i>
                <span>放照片位置</span>
            </div>
        </div>

        <!-- 基本資料 -->
        <h1>李梅花</h1>
        <div class="subtitle">黎明技術學院數位多媒體系</div>
        <p class="bio">「喜歡簡單生活，也喜歡認真對待每一件事。」</p>

        <!-- 精簡後的興趣與技能標籤 -->
        <div class="tags">
            <span class="tag interest"><i class="fa-solid fa-book-open"></i> 讀書</span>
            <span class="tag interest"><i class="fa-solid fa-bed"></i> 睡覺</span>
            <span class="tag skill"><i class="fa-solid fa-code"></i> 寫代碼</span>
            <span class="tag skill"><i class="fa-solid fa-calculator"></i> 微積分</span>
        </div>

        <!-- 聯絡方式 -->
        <div class="links">
            <a href="mailto:bd1151014@venus.lit.edu.tw" class="link-btn">
                <i class="fa-regular fa-envelope" style="color: #3b82f6;"></i>
                bd1151014@venus.lit.edu.tw
            </a>
            <div class="link-btn">
                <i class="fa-brands fa-line" style="color: #10b981;"></i>
                Line ID: thip (李梅花)
            </div>
            <a href="https://instagram.com/thip._.1234" target="_blank" rel="noopener noreferrer" class="link-btn">
                <i class="fa-brands fa-instagram" style="color: #ec4899;"></i>
                @thip._.1234
            </a>
        </div>

        <div class="footer">
            &copy; 2026 李梅花
        </div>
    </main>

</body>
</html>
