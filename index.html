<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李梅花 | 個人履歷</title>
    
    <!-- 引入 Tailwind CSS 以進行現代化排版與樣式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Font Awesome 提供專業圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入 Google Fonts (Noto Sans TC) 以優化中文字體顯示 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc; /* Tailwind slate-50 */
            color: #334155; /* Tailwind slate-700 */
        }
        
        /* 加入簡單的淡入動畫讓網頁載入時更平滑 */
        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <main class="max-w-3xl w-full space-y-8 fade-in">

                    <div class="w-12 h-12 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center text-xl mb-3 group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <span class="text-sm text-slate-500 mb-1">Instagram</span>

        <!-- Footer -->

</body>
</html>
